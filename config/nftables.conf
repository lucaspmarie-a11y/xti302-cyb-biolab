#!/usr/sbin/nft -f
# J2 (autonomie) - pare-feu nftables : tout refusé par défaut, sauf SSH
# et le trafic des connexions déjà établies. Survit au redémarrage via
# le service nftables.service (chargé depuis ce fichier à /etc/nftables.conf).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        icmp type echo-request accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
