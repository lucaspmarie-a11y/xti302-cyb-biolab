# J1 - fail2ban protège SSH : bannissement après 4 échecs, 10 minutes
#
# mode = aggressive (et pas le "normal" par défaut) : S1 interdit le mot
# de passe, donc une attaque ici ressemble à des connexions fermées en
# pré-authentification ("Connection closed by authenticating user ...
# [preauth]", "drop connection ... penalty: failed authentication" sur
# les OpenSSH récents) et PAS à des lignes "Failed password". Le mode
# "normal" marque explicitement ces fermetures comme non-échecs
# (NOFAIL) : vérifié sur la VM, 4 tentatives de clé invalide ne
# déclenchaient aucun banissement tant que mode=normal. "aggressive"
# compte bien ces fermetures pré-auth comme des échecs.
[sshd]
enabled = true
port = ssh
backend = systemd
mode = aggressive
maxretry = 4
findtime = 10m
bantime = 10m
