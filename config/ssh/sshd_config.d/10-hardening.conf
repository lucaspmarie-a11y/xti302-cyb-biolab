# S1-S5 - durcissement SSH (XTI302-CYB, contexte C BioLab)

# S1 - connexion par clé uniquement
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# S2 - connexion root interdite
PermitRootLogin no

# S3 - seuls les comptes du groupe acces_ssh peuvent se connecter
AllowGroups acces_ssh

# S4 - au plus 4 essais d'authentification par connexion,
#      session inactive fermée au bout de 15 minutes au plus
#      (ClientAliveInterval * ClientAliveCountMax = 5 min * 3 = 15 min)
MaxAuthTries 4
ClientAliveInterval 300
ClientAliveCountMax 3

# Contexte C - le groupe invite n'a qu'un accès SFTP, sans shell interactif
Match Group invite
    ForceCommand internal-sftp
    ChrootDirectory /srv
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
